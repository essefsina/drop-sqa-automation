name: DropIt SQA Automation

on:
  push:
  pull_request:

jobs:
  cucumber-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this test suite
        uses: actions/checkout@v4

      - name: Check out DropIt (system under test)
        uses: actions/checkout@v4
        with:
          repository: essefsina/DropIt
          path: dropit-server

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install light Python deps (DropIt core itself is stdlib-only)
        run: pip install numpy pillow

      - name: Run the 100 Cucumber use cases
        env:
          DROPIT_PY: ${{ github.workspace }}/dropit-server/src/dropit.py
        run: mvn -B test

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: |
            target/cucumber-report.html
            target/cucumber.json
            target/dropit-server.log
          if-no-files-found: ignore
